[project]
name = "mra-cli"
version = "1.0.0"
description = "CLI interface for market regime analysis"
requires-python = ">=3.13"
dependencies = [
    "mra-lib",
    "click>=8.5.0",
]

[project.optional-dependencies]
# `mra start-api` serves the web API; install with `mra-cli[api]`
api = ["mra-web"]

[project.scripts]
mra = "mra_cli.main:cli"
mra-optimize = "mra_cli.optimization:main"

[tool.uv.sources]
mra-lib = { workspace = true }
mra-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mra_cli"]
