[project]
name = "mra-lib"
version = "1.0.0"
description = "Core library for market regime analysis using Hidden Markov Models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hmmlearn>=0.3.3,<0.4",  # detector uses private _covars_/_compute_log_likelihood
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polygon-api-client>=1.16.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mra_lib"]
