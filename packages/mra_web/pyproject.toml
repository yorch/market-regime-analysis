[project]
name = "mra-web"
version = "1.0.0"
description = "Web API for market regime analysis"
requires-python = ">=3.13"
dependencies = [
    "mra-lib",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
mra-api = "mra_web.server:main"

[tool.uv.sources]
mra-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mra_web"]
