name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker images to registries"
        type: boolean
        default: true

# Least privilege by default; jobs that need more (docker) ask for it explicitly.
permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main and tags always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.22" # keep in step with the Dockerfile's uv image
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: just lint

      - name: Format check (ruff format)
        run: just fmt-check

  # ── Type Check ───────────────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.22" # keep in step with the Dockerfile's uv image
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check (mypy) — soft-fail until fully annotated
        run: just types
        continue-on-error: true

  # ── Test ─────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.22" # keep in step with the Dockerfile's uv image
          python-version: ${{ matrix.python-version }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install dependencies
        run: uv sync --locked

      # Threshold comes from [tool.coverage.report] fail_under in pyproject.toml
      - name: Run unit tests with coverage
        run: just test-cov --tb=short

  # ── Build ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.22" # keep in step with the Dockerfile's uv image
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Build mra-lib
        run: uv build --package mra-lib

      - name: Build mra-cli
        run: uv build --package mra-cli

      - name: Build mra-web
        run: uv build --package mra-web

  # ── Integration Test (manual only) ──────────────────────────────────────
  # Live provider APIs; the only job that receives provider secrets.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.22" # keep in step with the Dockerfile's uv image
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Integration tests
        run: just test-integration -v --tb=short

  # ── Docker ───────────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to external registry
        if: vars.EXTERNAL_REGISTRY_URL != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.EXTERNAL_REGISTRY_URL }}
          username: ${{ secrets.EXTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.EXTERNAL_REGISTRY_PASSWORD }}

      # Smoke test: the image must boot and pass its own /health check.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mra-smoke:ci
          platforms: linux/amd64
          cache-from: type=gha

      - name: Smoke test (/health)
        run: |
          JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export JWT_SECRET
          docker run -d --name mra-smoke -p 127.0.0.1:8000:8000 -e JWT_SECRET mra-smoke:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo; echo "healthy"; docker rm -f mra-smoke >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs mra-smoke; docker rm -f mra-smoke; exit 1

      - name: Extract commit metadata
        id: meta-info
        run: |
          echo "datetime=$(git log -1 --format='%cd' --date=format:'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image list
        id: images
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          if [ -n "${{ vars.EXTERNAL_REGISTRY_URL }}" ]; then
            EXTERNAL_IMAGE="${{ vars.EXTERNAL_REGISTRY_URL }}/${{ vars.EXTERNAL_REGISTRY_IMAGE || github.event.repository.name }}"
            IMAGES="${IMAGES},${EXTERNAL_IMAGE}"
          fi
          echo "list=${IMAGES}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.meta-info.outputs.datetime }}_${{ steps.meta-info.outputs.sha }},enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish-docker')) || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
