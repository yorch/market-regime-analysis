# ── Virtual workspace root ─────────────────────────────────────────────────
# This file ties the workspace packages together and centralizes tool config.
# It is NOT a buildable package itself.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mra-lib = { workspace = true }
mra-cli = { workspace = true }
mra-web = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.10",
]

# ── Ruff (shared across all packages) ──────────────────────────────────────

[tool.ruff]
line-length = 100
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "G", "T20", "SIM", "PL", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"packages/mra_web/src/mra_web/*.py" = ["T201", "PLR2004", "PLR0913", "PLR0917"]
"packages/mra_lib/src/mra_lib/analyzer.py" = ["PLR2004", "B023", "B904", "PLR0912", "PLR0915", "PLC0415", "SIM102", "SIM118", "RUF005"]
"packages/mra_lib/src/mra_lib/portfolio/*.py" = ["PLR2004"]
"packages/mra_lib/src/mra_lib/risk/*.py" = ["PLR2004", "PLR0913", "PLR0917"]
"packages/mra_lib/src/mra_lib/backtesting/*.py" = ["PLR2004", "PLR0913", "PLR0917", "SIM102", "SIM103"]
"packages/mra_cli/src/mra_cli/*.py" = ["T201", "PLR2004"]
"**/tests/*.py" = ["T201", "BLE001", "PLC0415", "PLR0912", "PLR0915", "PLR2004"]
"examples/*.py" = ["T201", "PLR2004", "BLE001"]
"*.ipynb" = ["E402", "PLR2004", "RUF001", "T201"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["mra_lib", "mra_cli", "mra_web"]

# ── mypy (shared across all packages) ──────────────────────────────────────

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
explicit_package_bases = true
mypy_path = [
    "packages/mra_lib/src",
    "packages/mra_cli/src",
    "packages/mra_web/src",
]
plugins = ["pydantic.mypy"]
exclude = ["packages/.*/tests/"]

[[tool.mypy.overrides]]
module = [
    "hmmlearn.*",
    "yfinance.*",
    "polygon.*",
    "requests",
    "requests.*",
    "sklearn.*",
    "statsmodels.*",
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
    "jose",
    "jose.*",
    "matplotlib",
    "matplotlib.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

# ── pytest (shared across all packages) ────────────────────────────────────

[tool.pytest.ini_options]
testpaths = [
    "packages/mra_lib/tests",
    "packages/mra_cli/tests",
    "packages/mra_web/tests",
]
addopts = "--strict-markers -ra"
markers = [
    "integration: tests that call external APIs (deselect with '-m \"not integration\"')",
    "slow: tests that take a long time to run (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    # Third-party deprecations we cannot fix (polygon-api-client / websockets internals)
    "ignore::DeprecationWarning:polygon.*",
    "ignore::DeprecationWarning:websockets.*",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ── coverage (shared across all packages) ────────────────────────────────

[tool.coverage.run]
source = [
    "packages/mra_lib/src",
    "packages/mra_cli/src",
    "packages/mra_web/src",
]
omit = [
    "**/tests/*",
    "**/__pycache__/*",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
# Regexes are matched against each source line; anchor them so e.g. "pass" does not
# also exclude every ``@click.pass_context`` command.
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*pass\\s*$",
    "^\\s*\\.\\.\\.\\s*$",
    "raise NotImplementedError",
]
