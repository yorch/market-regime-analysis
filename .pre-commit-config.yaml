# Local hooks run the tools from the project venv, so their versions (and mypy's
# view of installed packages/plugins) come from uv.lock rather than a separate
# pre-commit environment. Run `uv sync` first.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Manual stage (whole-package run); CI's typecheck job blocks on mypy, so run it
      # (or `just types`) before pushing:
      #   uv run pre-commit run mypy --hook-stage manual --all-files
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy packages/
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [manual]
