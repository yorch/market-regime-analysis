services:
  api:
    build: .
    image: market-regime-analysis
    # Alternative: pull the published image from GHCR
    # image: ghcr.io/<owner>/market-regime-analysis:latest
    restart: unless-stopped
    # The image's default command is `mra-api --host 0.0.0.0 --port 8000`.
    environment:
      # ── Server ─────────────────────────────────────────────────────────
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ENABLE_DOCS: "${ENABLE_DOCS:-false}"
      # >1 needs the fixed JWT_SECRET below (it is required here anyway); the
      # rate limiter and WebSocket/analysis caps below are per worker process.
      API_WORKERS: "${API_WORKERS:-1}"
      API_TIMEOUT: "${API_TIMEOUT:-300}"
      API_MAX_CONCURRENT_ANALYSES: "${API_MAX_CONCURRENT_ANALYSES:-4}"
      WS_MAX_CONNECTIONS: "${WS_MAX_CONNECTIONS:-100}"
      WS_MAX_CONNECTIONS_PER_IP: "${WS_MAX_CONNECTIONS_PER_IP:-5}"

      # ── Authentication (JWT_SECRET is required) ─────────────────────────
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (>=32 chars)}"
      JWT_EXPIRATION_HOURS: "${JWT_EXPIRATION_HOURS:-24}"
      API_KEYS: "${API_KEYS:-}"

      # ── HTTP policy ────────────────────────────────────────────────────
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      CORS_METHODS: "${CORS_METHODS:-GET,POST,OPTIONS}"
      CORS_HEADERS: "${CORS_HEADERS:-Authorization,Content-Type,X-API-Key}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"

      # ── Data provider credentials ──────────────────────────────────────
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY:-}"
      POLYGON_API_KEY: "${POLYGON_API_KEY:-}"
      APCA_API_KEY_ID: "${APCA_API_KEY_ID:-}"
      APCA_API_SECRET_KEY: "${APCA_API_SECRET_KEY:-}"
      ALPACA_DATA_FEED: "${ALPACA_DATA_FEED:-}"
      TIINGO_API_KEY: "${TIINGO_API_KEY:-}"

      # ── Regime history (SQLite, on the app-data volume) ────────────────
      MRA_DB_PATH: "/home/mra/.mra/regimes.db"
    ports:
      # Published on the host's loopback only; put a TLS reverse proxy in front
      # (or change the bind address) to expose it beyond this machine.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Provider caches (e.g. yfinance timezone cache) survive restarts
      - app-cache:/home/mra/.cache
      # Regime history database (MRA_DB_PATH) survives restarts and rebuilds
      - app-data:/home/mra/.mra
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

volumes:
  app-cache:
  app-data:
